on:
  workflow_call:
    inputs:
      artifactPattern:
        required: true
        type: string
        default: "release-packages-*"
        description: "Pattern to match the artifact names to download"
      environment:
        required: true
        type: string
        default: "nuget-production"
        description: "Environment name for manual approval (must be configured in repository settings)"
      runId:
        required: true
        type: string
        description: "ID of the workflow run to download artifacts from"
      workflowName:
        required: true
        type: string
        default: "ci-dotnet.yml"
        description: "Name of the workflow to check for successful builds"
    secrets:
      NUGET_TOKEN:
        required: false
        description: "Legacy API key. Ignored when NUGET_USER is set (Trusted Publishing)."
      NUGET_USER:
        required: false
        description: "nuget.org profile name for Trusted Publishing (OIDC)"
      WORKFLOW_PACKAGES:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  nuget:
    name: Publish NuGet Packages
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}

    steps:
      - name: Download artifacts from `${{ inputs.workflowName }}` workflow
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.WORKFLOW_PACKAGES }}
          merge-multiple: true
          path: packages
          pattern: ${{ inputs.artifactPattern }}
          run-id: ${{ inputs.runId }}

      - name: NuGet login (Trusted Publishing)
        id: login
        if: ${{ env.NUGET_USER != '' }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ env.NUGET_USER }}

      - name: Publish NuGet Package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_TOKEN }}
        run: |
          dotnet nuget push packages/**/*.nupkg -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate
