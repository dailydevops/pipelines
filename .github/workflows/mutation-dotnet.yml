on:
  workflow_call:
    inputs:
      configurationFile:
        required: false
        type: string
        default: 'stryker-config.json'
    secrets:
      STRYKER_DASHBOARD_API_KEY:
        required: true

concurrency:
  group: ${{ github.workflow_ref }}@${{ github.ref }}-mutate-${{ inputs.configurationFile }}
  cancel-in-progress: true

env:
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 0
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

permissions:
  contents: read

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Stryker configuration file
        id: check-config
        env:
          CONFIG_FILE: ${{ inputs.configurationFile || 'stryker-config.json' }}
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::Stryker configuration file '$CONFIG_FILE' not found"
            exit 1
          fi
          echo "path=$CONFIG_FILE" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ vars.NE_DOTNET_TARGETFRAMEWORKS || '10.x' }}

      - name: Install Stryker.NET
        run: dotnet tool install --global dotnet-stryker --version 5.1.0

      - name: Run Stryker.NET against Repository
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
          CONFIG_FILE: ${{ steps.check-config.outputs.path }}
        run: dotnet stryker --config-file "$CONFIG_FILE"

      - name: Write Stryker step summary
        if: ${{ !cancelled() && steps.check-config.outcome == 'success' }}
        run: |
          report=$(find . -path '*/StrykerOutput/*/reports/*.md' -type f | sort | tail -n 1)
          if [ -n "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Stryker HTML reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.check-config.outcome == 'success' }}
        with:
          name: mutation-report-${{ hashFiles(steps.check-config.outputs.path) }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/StrykerOutput/**/*.html