on:
  workflow_call:
    inputs:
      disableCodeFormat:
        required: false
        type: boolean
        default: false
      disableCoverageUpload:
        required: false
        type: boolean
        default: false
      disableDependaMerge:
        required: false
        type: boolean
        default: false
      disablePrebuild:
        required: false
        type: boolean
        default: false
      disableTestsOnLinux:
        required: false
        type: boolean
        default: false
      disableTestsOnMacOs:
        required: false
        type: boolean
        default: true
      disableTestsOnWindows:
        required: false
        type: boolean
        default: true
      dotnetLogging:
        required: false
        type: string
        default: minimal
      dotnetVersion:
        required: false
        type: string
        default: |
          8.x
          9.x
      enableCleanUpDockerDocker:
        required: false
        type: boolean
        default: false
      failFast:
        required: false
        type: boolean
        default: true
      runsOnBuild:
        required: false
        type: string
        default: 'ubuntu-latest'
      script-path:
        required: true
        type: string
      solution:
        required: true
        type: string
      clearDevCerts:
        required: false
        type: boolean
        default: false
    secrets:
      FETCH_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow_ref }}@${{ github.ref }}-build-matrix-${{ inputs.solution }}
  cancel-in-progress: true

env:
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  commitlinter:
    name: Commit Linter
    uses: ./.github/workflows/step-node-commitlint.yml
    secrets: inherit

  version:
    name: Version Management
    uses: ./.github/workflows/step-dotnet-version.yml
    with:
      dotnet-version: ${{ inputs.dotnetVersion || '8.x' }}
    secrets: inherit

  collect:
    name: Collect Dynamic Matrix
    uses: ./.github/workflows/step-collect-matrix.yml
    with:
      script-path: ${{ inputs.script-path }}
    secrets: inherit

  format:
    name: Code Formatting
    if: ${{ !inputs.disableCodeFormat }}
    uses: ./.github/workflows/step-dotnet-format.yml
    needs:
      - commitlinter
    with:
      dotnet-logging: ${{ inputs.dotnetLogging || 'minimal' }}
      dotnet-version: ${{ inputs.dotnetVersion || '8.x' }}
      runs-on: ${{ inputs.runsOnBuild || 'ubuntu-latest' }}
    secrets: inherit

  prebuild:
    name: Prebuild Solution
    if: ${{ !inputs.disablePrebuild && !inputs.disableTestsOnLinux }}
    uses: ./.github/workflows/step-dotnet-prebuild.yml
    needs:
      - commitlinter
      - version
    with:
      dotnet-logging: ${{ inputs.dotnetLogging || 'minimal' }}
      dotnet-version: ${{ inputs.dotnetVersion || '8.x' }}
      runs-on: ${{ inputs.runsOnBuild || 'ubuntu-latest' }}
      solution: ${{ inputs.solution }}
      solution-version: ${{ needs.version.outputs.solution-version }}
    secrets: inherit

  tests:
    name: Run Tests
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/step-dotnet-tests.yml
    needs:
      - commitlinter
      - version
      - collect
      - prebuild
    strategy:
      fail-fast: ${{ inputs.failFast }}
      matrix:
        test-filter: ${{ fromJson(needs.collect.outputs.matrix) }}
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        exclude:
          - os: ${{ inputs.disableTestsOnMacOs && 'macos-latest' }}
          - os: ${{ inputs.disableTestsOnLinux && 'ubuntu-latest' }}
          - os: ${{ inputs.disableTestsOnWindows && 'windows-latest' }}
    with:
      clear-dev-certs: ${{ inputs.clearDevCerts || false }}
      disableCoverageUpload: ${{ inputs.disableCoverageUpload || false }}
      dotnet-logging: ${{ inputs.dotnetLogging || 'minimal' }}
      dotnet-version: ${{ inputs.dotnetVersion || '8.x' }}
      enableCleanUpDockerDocker: ${{ inputs.enableCleanUpDockerDocker || false }}
      execution-name: ${{ matrix.test-filter }}
      prebuilt-artifact: ${{ needs.prebuild.outputs.artifact-name }}
      runs-on: ${{ matrix.os }}
      solution: ${{ inputs.solution }}
      solution-version: ${{ needs.version.outputs.solution-version }}
      test-filter: "/*/*/*/*[TestGroup=${{ matrix.test-filter }}]"
    secrets: inherit

  build:
    name: Build Solution
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/step-dotnet-build.yml
    needs:
      - tests
      - format
      - version
    with:
      dotnet-logging: ${{ inputs.dotnetLogging || 'minimal' }}
      dotnet-version: ${{ inputs.dotnetVersion || '8.x' }}
      runs-on: ${{ inputs.runsOnBuild || 'ubuntu-latest' }}
      solution: ${{ inputs.solution }}
      solution-version: ${{ needs.version.outputs.solution-version }}
    secrets: inherit
  # Best-effort cleanup of the prebuilt artifact once all test jobs are done,
  # regardless of their outcome. Deleting via the REST API would require
  # 'actions: write' on the caller's GITHUB_TOKEN (and break callers without
  # it at startup), so the large artifact is instead replaced by a tiny
  # placeholder via 'overwrite: true', which only needs the runtime token.
  cleanup-prebuilt:
    name: Cleanup Prebuilt Artifact
    if: ${{ always() && needs.prebuild.result == 'success' }}
    runs-on: ubuntu-latest
    needs:
      - prebuild
      - tests
    steps:
      - name: Create placeholder
        run: echo "prebuilt output cleaned up after test execution" > cleaned-up.txt

      - name: Replace prebuilt artifact with placeholder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: ${{ needs.prebuild.outputs.artifact-name }}
          path: cleaned-up.txt
          retention-days: 1
          overwrite: true
