on:
  workflow_call:
    inputs:
      disableCodeFormat:
        required: false
        type: boolean
        default: false
      disableCoverageUpload:
        required: false
        type: boolean
        default: false
      disableDependaMerge:
        required: false
        type: boolean
        default: false
      disablePrebuild:
        required: false
        type: boolean
        default: false
      disableTestsOnLinux:
        required: false
        type: boolean
        default: false
      disableTestsOnMacOs:
        required: false
        type: boolean
        default: true
      disableTestsOnWindows:
        required: false
        type: boolean
        default: true
      dotnetLogging:
        required: false
        type: string
        default: minimal
      dotnetVersion:
        required: false
        type: string
        default: |
          8.x
          9.x
      enableCleanUpDockerDocker:
        required: false
        type: boolean
        default: false
      failFast:
        required: false
        type: boolean
        default: true
      runsOnBuild:
        required: false
        type: string
        default: 'ubuntu-latest'
      script-path:
        required: true
        type: string
      solution:
        required: true
        type: string
      clearDevCerts:
        required: false
        type: boolean
        default: false
    secrets:
      FETCH_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow_ref }}@${{ github.ref }}-build-matrix-${{ inputs.solution }}
  cancel-in-progress: true

env:
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  commitlinter:
    name: Commit Linter
    uses: ./.github/workflows/step-node-commitlint.yml
    secrets: inherit

  version:
    name: Version Management
    uses: ./.github/workflows/step-dotnet-version.yml
    with:
      dotnet-version: ${{ inputs.dotnetVersion || '8.x' }}
    secrets: inherit

  collect:
    name: Collect Dynamic Matrix
    uses: ./.github/workflows/step-collect-matrix.yml
    with:
      script-path: ${{ inputs.script-path }}
    secrets: inherit

  format:
    name: Code Formatting
    if: ${{ !inputs.disableCodeFormat }}
    uses: ./.github/workflows/step-dotnet-format.yml
    needs:
      - commitlinter
    with:
      dotnet-logging: ${{ inputs.dotnetLogging || 'minimal' }}
      dotnet-version: ${{ inputs.dotnetVersion || '8.x' }}
      runs-on: ${{ inputs.runsOnBuild || 'ubuntu-latest' }}
    secrets: inherit

  prebuild:
    name: Prebuild Solution
    if: ${{ !inputs.disablePrebuild && !inputs.disableTestsOnLinux }}
    uses: ./.github/workflows/step-dotnet-prebuild.yml
    needs:
      - commitlinter
      - version
    with:
      dotnet-logging: ${{ inputs.dotnetLogging || 'minimal' }}
      dotnet-version: ${{ inputs.dotnetVersion || '8.x' }}
      runs-on: ${{ inputs.runsOnBuild || 'ubuntu-latest' }}
      solution: ${{ inputs.solution }}
      solution-version: ${{ needs.version.outputs.solution-version }}
    secrets: inherit

  tests:
    name: Run Tests
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/step-dotnet-tests.yml
    needs:
      - commitlinter
      - version
      - collect
      - prebuild
    strategy:
      fail-fast: ${{ inputs.failFast }}
      matrix:
        test-filter: ${{ fromJson(needs.collect.outputs.matrix) }}
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        exclude:
          - os: ${{ inputs.disableTestsOnMacOs && 'macos-latest' }}
          - os: ${{ inputs.disableTestsOnLinux && 'ubuntu-latest' }}
          - os: ${{ inputs.disableTestsOnWindows && 'windows-latest' }}
    with:
      clear-dev-certs: ${{ inputs.clearDevCerts || false }}
      disableCoverageUpload: ${{ inputs.disableCoverageUpload || false }}
      dotnet-logging: ${{ inputs.dotnetLogging || 'minimal' }}
      dotnet-version: ${{ inputs.dotnetVersion || '8.x' }}
      enableCleanUpDockerDocker: ${{ inputs.enableCleanUpDockerDocker || false }}
      execution-name: ${{ matrix.test-filter }}
      prebuilt-artifact: ${{ needs.prebuild.outputs.artifact-name }}
      runs-on: ${{ matrix.os }}
      solution: ${{ inputs.solution }}
      solution-version: ${{ needs.version.outputs.solution-version }}
      test-filter: "/*/*/*/*[TestGroup=${{ matrix.test-filter }}]"
    secrets: inherit

  build:
    name: Build Solution
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/step-dotnet-build.yml
    needs:
      - tests
      - format
      - version
    with:
      dotnet-logging: ${{ inputs.dotnetLogging || 'minimal' }}
      dotnet-version: ${{ inputs.dotnetVersion || '8.x' }}
      runs-on: ${{ inputs.runsOnBuild || 'ubuntu-latest' }}
      solution: ${{ inputs.solution }}
      solution-version: ${{ needs.version.outputs.solution-version }}
    secrets: inherit
  # Best-effort deletion of the prebuilt artifact once all test jobs are done,
  # regardless of their outcome. Requires `actions: write` on the caller's
  # GITHUB_TOKEN; without it the artifact simply expires via retention-days.
  cleanup-prebuilt:
    name: Cleanup Prebuilt Artifact
    if: ${{ always() && needs.prebuild.result == 'success' }}
    runs-on: ubuntu-latest
    needs:
      - prebuild
      - tests
    permissions:
      actions: write
    steps:
      - name: Delete prebuilt artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=${{ needs.prebuild.outputs.artifact-name }}" -q '.artifacts[0].id')
          if [ -n "$artifact_id" ] && [ "$artifact_id" != "null" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
            echo "Deleted artifact ${{ needs.prebuild.outputs.artifact-name }} ($artifact_id)"
          else
            echo "Artifact ${{ needs.prebuild.outputs.artifact-name }} not found, nothing to delete"
          fi
